name: photoflare
title: PhotoFlare
version: 1.7.6
summary: PhotoFlare
description: Simple but powerful Cross Platform image editor
license: GPL-3.0
website: https://photoflare.io
source-code: https://github.com/PhotoFlare/photoflare
issues: https://github.com/PhotoFlare/photoflare/issues
icon: installers/deb/DEBIAN/usr/share/icons/hicolor/256x256/apps/photoflare.png
type: app

base: core24
confinement: strict
grade: stable

apps:
  photoflare:
    # Wrapper sets the GraphicsMagick module/config paths, then execs photoflare.
    command: bin/photoflare-launch
    desktop: usr/share/applications/photoflare.desktop
    common-id: io.photoflare.photoflare
    # Qt 6 (and the desktop/wayland/x11/opengl/unity7 plugs) come from the
    # kf6-core24 content snap via this extension.
    extensions: [kde-neon-qt6]
    plugs:
      - home             # open/save images in the user's home
      - removable-media  # open/save images on USB drives / external disks
      - network          # update check, G'MIC filter updates
      - cups             # printing (File > Print)

parts:
  photoflare:
    source: .
    source-type: local
    plugin: nil
    build-packages:
      - libgraphicsmagick++-dev
      - libomp-dev
      - qt6-translations-l10n
    override-build: |
      # PREFIX=/usr so data (translations, icons) lands in $SNAP/usr/share,
      # which is on XDG_DATA_DIRS inside the snap.
      qmake6 PREFIX=/usr $CRAFT_PART_SRC
      make -j$(nproc)
      make install INSTALL_ROOT=$CRAFT_PART_INSTALL
      # The desktop file's themed icon name can't be resolved from the host.
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/256x256/apps/photoflare.png|' \
        $CRAFT_PART_INSTALL/usr/share/applications/photoflare.desktop
      mkdir -p $CRAFT_PART_INSTALL/bin
      cat > $CRAFT_PART_INSTALL/bin/photoflare-launch <<'EOF'
      #!/bin/sh
      # Point GraphicsMagick at its staged config and coder/filter modules,
      # since its compiled-in paths refer to the host /usr/lib, not $SNAP.
      cfg=$(find "$SNAP/usr/lib" "$SNAP/usr/share" -maxdepth 3 -type d -path '*GraphicsMagick*' -name config 2>/dev/null | head -n1)
      [ -n "$cfg" ] && export MAGICK_CONFIGURE_PATH="$cfg"
      coders=$(find "$SNAP/usr/lib" -maxdepth 4 -type d -path '*GraphicsMagick*' -name coders 2>/dev/null | head -n1)
      [ -n "$coders" ] && export MAGICK_CODER_MODULE_PATH="$coders"
      filters=$(find "$SNAP/usr/lib" -maxdepth 4 -type d -path '*GraphicsMagick*' -name filters 2>/dev/null | head -n1)
      [ -n "$filters" ] && export MAGICK_FILTER_MODULE_PATH="$filters"
      exec "$SNAP/usr/bin/photoflare" "$@"
      EOF
      chmod +x $CRAFT_PART_INSTALL/bin/photoflare-launch
    stage-packages:
      - libgraphicsmagick++-q16-12t64
      - libomp5-18

  gmic-qt:
    source: https://github.com/c-koi/gmic-qt.git
    source-type: git
    source-tag: v.3.4.2
    plugin: cmake
    cmake-parameters:
      - -DBUILD_WITH_QT6=ON
      - -DGMIC_QT_HOST=none
      - -DENABLE_SYSTEM_GMIC=OFF
      - -DENABLE_FFTW3=ON
      - -DENABLE_CURL=ON
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_EXE_LINKER_FLAGS=-no-pie
    override-pull: |
      craftctl default
      # core24 ships Qt 6.4.2, but gmic-qt's CMakeLists requests Qt >= 6.5.0.
      # The source has no 6.5-only API usage, so relax the minimum version.
      sed -i 's/set(MIN_QT_VERSION 6\.5\.0)/set(MIN_QT_VERSION 6.4.0)/' CMakeLists.txt
      grep -q 'MIN_QT_VERSION 6.4.0' CMakeLists.txt
      # Clone the matching G'MIC source one level above the gmic-qt checkout so
      # that gmic-qt's CMakeLists default GMIC_PATH (../gmic/src) resolves correctly.
      git clone --depth 1 --branch v.4.0.5 \
        https://github.com/GreycLab/gmic.git \
        $CRAFT_PART_SRC/../gmic
      # Pre-fetch CImg.h from the matching versioned tag — the gmic Makefile's
      # CImg.h target downloads from master (latest) which causes a version mismatch.
      GMIC_SRC="$CRAFT_PART_SRC/../gmic/src"
      GMIC_VER=$(grep -o 'gmic_version [0-9]*' "$GMIC_SRC/gmic.h" | grep -o '[0-9]*')
      MAJOR=$(echo $GMIC_VER | cut -c1)
      MINOR=$(echo $GMIC_VER | cut -c2)
      PATCH=$(echo $GMIC_VER | cut -c3)
      wget --no-check-certificate --quiet -O "$GMIC_SRC/CImg.h" \
        "https://github.com/GreycLab/CImg/raw/v.${MAJOR}.${MINOR}.${PATCH}/CImg.h"
      # `make gmic_stdlib_community.h` yields an empty header here, and gmic.eu
      # only hosts the header for the current G'MIC release (pinned tags 404).
      # The header is only a data_gmic byte array, so fetch the latest one.
      LATEST_VER=$(git ls-remote --tags --refs https://github.com/GreycLab/gmic.git 'v.*' \
        | sed 's|.*refs/tags/v\.||' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 | tr -d '.')
      test -n "$LATEST_VER"
      wget --quiet -O "$GMIC_SRC/gmic_stdlib_community.h" \
        "https://gmic.eu/gmic_stdlib_community${LATEST_VER}.h"
      grep -q 'data_gmic' "$GMIC_SRC/gmic_stdlib_community.h"
    build-packages:
      - cmake
      - make
      - wget
      - libfftw3-dev
      - libcurl4-openssl-dev
      - libomp-dev
      - qt6-l10n-tools   # provides lrelease (not in the kf6 SDK snap)
      - qt6-tools-dev-tools
    override-build: |
      # gmic-qt's translations/lrelease.sh only looks for `lrelease` or
      # `lrelease-qt5` on PATH; Qt 6 installs it under /usr/lib/qt6/bin (or in
      # the kf6-core24 SDK snap). `craftctl default` runs the cmake steps in a
      # separate process that does not inherit PATH changes from this script,
      # so link it into a directory that is already on PATH (the build runs in
      # a disposable instance).
      for candidate in /snap/kf6-core24-sdk/current/usr/lib/qt6/bin/lrelease /snap/kf6-core24-sdk/current/usr/bin/lrelease /usr/lib/qt6/bin/lrelease /usr/lib/qt6/libexec/lrelease /usr/bin/lrelease-qt6 "$(command -v lrelease-qt6 || true)" "$(command -v lrelease || true)"; do
        if [ -n "$candidate" ] && [ -x "$candidate" ]; then
          [ "$candidate" = /usr/local/bin/lrelease ] || ln -sf "$candidate" /usr/local/bin/lrelease
          break
        fi
      done
      test -x /usr/local/bin/lrelease
      craftctl default
      # Install prefix is /usr, so the binary lands in usr/bin next to the
      # photoflare binary where the app looks for it.
      mv $CRAFT_PART_INSTALL/usr/bin/gmic_qt $CRAFT_PART_INSTALL/usr/bin/gmic_photoflare_qt
    stage-packages:
      - libfftw3-double3
      - libomp5-18
      - libcurl4t64
