name: photoflare
title: PhotoFlare
version: 1.7.5
summary: PhotoFlare
description: Simple but powerful Cross Platform image editor
license: GPL-3.0
website: https://photoflare.io
source-code: https://github.com/PhotoFlare/photoflare
issues: https://github.com/PhotoFlare/photoflare/issues
icon: installers/deb/DEBIAN/usr/share/icons/hicolor/48x48/apps/photoflare.png
type: app

base: core24
confinement: classic
grade: stable

apps:
  photoflare:
    command: usr/local/bin/photoflare
    desktop: usr/local/share/applications/photoflare.desktop

parts:
  photoflare:
    source: .
    source-type: local
    plugin: nil
    build-packages:
      - qt6-base-dev
      - qt6-tools-dev-tools
      - qt6-translations-l10n
      - libgraphicsmagick++-dev
      - libomp-dev
    override-build: |
      qmake6 $CRAFT_PART_SRC
      make -j$(nproc)
      make install INSTALL_ROOT=$CRAFT_PART_INSTALL
    stage-packages:
      - libgraphicsmagick++-q16-12t64
      - libomp5-18
      - libqt6printsupport6
      - qt6-image-formats-plugins

  gmic-qt:
    source: https://github.com/c-koi/gmic-qt.git
    source-type: git
    source-tag: v.3.4.2
    plugin: cmake
    cmake-parameters:
      - -DBUILD_WITH_QT6=ON
      - -DGMIC_QT_HOST=none
      - -DENABLE_SYSTEM_GMIC=OFF
      - -DENABLE_FFTW3=ON
      - -DENABLE_CURL=ON
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_EXE_LINKER_FLAGS=-no-pie
    override-pull: |
      craftctl default
      # core24 ships Qt 6.4.2, but gmic-qt's CMakeLists requests Qt >= 6.5.0.
      # The source has no 6.5-only API usage, so relax the minimum version.
      sed -i 's/set(MIN_QT_VERSION 6\.5\.0)/set(MIN_QT_VERSION 6.4.0)/' CMakeLists.txt
      grep -q 'MIN_QT_VERSION 6.4.0' CMakeLists.txt
      # Clone the matching G'MIC source one level above the gmic-qt checkout so
      # that gmic-qt's CMakeLists default GMIC_PATH (../gmic/src) resolves correctly.
      git clone --depth 1 --branch v.4.0.5 \
        https://github.com/GreycLab/gmic.git \
        $CRAFT_PART_SRC/../gmic
      # Pre-fetch CImg.h from the matching versioned tag — the gmic Makefile's
      # CImg.h target downloads from master (latest) which causes a version mismatch.
      GMIC_SRC="$CRAFT_PART_SRC/../gmic/src"
      GMIC_VER=$(grep -o 'gmic_version [0-9]*' "$GMIC_SRC/gmic.h" | grep -o '[0-9]*')
      MAJOR=$(echo $GMIC_VER | cut -c1)
      MINOR=$(echo $GMIC_VER | cut -c2)
      PATCH=$(echo $GMIC_VER | cut -c3)
      wget --no-check-certificate --quiet -O "$GMIC_SRC/CImg.h" \
        "https://github.com/GreycLab/CImg/raw/v.${MAJOR}.${MINOR}.${PATCH}/CImg.h"
      # `make gmic_stdlib_community.h` yields an empty header here, and gmic.eu
      # only hosts the header for the current G'MIC release (pinned tags 404).
      # The header is only a data_gmic byte array, so fetch the latest one.
      LATEST_VER=$(git ls-remote --tags --refs https://github.com/GreycLab/gmic.git 'v.*' \
        | sed 's|.*refs/tags/v\.||' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 | tr -d '.')
      test -n "$LATEST_VER"
      wget --quiet -O "$GMIC_SRC/gmic_stdlib_community.h" \
        "https://gmic.eu/gmic_stdlib_community${LATEST_VER}.h"
      grep -q 'data_gmic' "$GMIC_SRC/gmic_stdlib_community.h"
    build-packages:
      - cmake
      - make
      - wget
      - qt6-base-dev
      - qt6-tools-dev
      - qt6-tools-dev-tools
      - qt6-l10n-tools
      - libfftw3-dev
      - libcurl4-openssl-dev
      - libomp-dev
    override-build: |
      # gmic-qt's translations/lrelease.sh only looks for `lrelease` or
      # `lrelease-qt5` on PATH; Qt 6 installs it under /usr/lib/qt6/bin.
      # `craftctl default` runs the cmake steps in a separate process that does
      # not inherit PATH changes from this script, so link it into a directory
      # that is already on PATH (the build runs in a disposable instance).
      for candidate in /usr/lib/qt6/bin/lrelease /usr/lib/qt6/libexec/lrelease /usr/bin/lrelease-qt6; do
        if [ -x "$candidate" ]; then
          ln -sf "$candidate" /usr/local/bin/lrelease
          break
        fi
      done
      test -x /usr/local/bin/lrelease
      craftctl default
      # The cmake plugin's default prefix is /usr/local, so the binary lands in
      # usr/local/bin, next to the photoflare binary where the app looks for it.
      mv $CRAFT_PART_INSTALL/usr/local/bin/gmic_qt $CRAFT_PART_INSTALL/usr/local/bin/gmic_photoflare_qt
    stage-packages:
      - libfftw3-double3
      - libomp5-18
